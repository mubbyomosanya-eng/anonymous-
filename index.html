<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Anonymous Chat</title>
<style>
  :root {
    --bg: #161819;
    --surface: #1f2224;
    --surface-2: #2a2e31;
    --text: #e8eaea;
    --muted: #9aa3a6;
    --accent: #5cb88a;
    --accent-ink: #0d1a13;
    --danger: #e5726b;
    --radius: 16px;
    --app-h: 100dvh; /* overwritten by JS when the keyboard opens */
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .screen { height: var(--app-h); display: flex; flex-direction: column; }

  /* ---------- Welcome ---------- */
  #welcome { align-items: center; justify-content: center; padding: 24px; }
  .card { width: 100%; max-width: 420px; display: grid; gap: 16px; }
  .card h1 { font-size: 1.9rem; letter-spacing: -0.02em; }
  .card p.lead { color: var(--muted); }
  label { display: block; margin-bottom: 6px; font-weight: 600; }
  .field { display: flex; gap: 8px; }
  input[type="text"], input[type="email"], input[type="password"] {
    flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--surface-2); background: var(--surface);
  }
  input::placeholder { color: var(--muted); }
  .hint { color: var(--muted); font-size: 0.85rem; margin-top: 6px; }
  .error { color: var(--danger); font-size: 0.9rem; min-height: 1.3em; }
  .btn {
    padding: 12px 16px; border-radius: 12px; border: 1px solid var(--surface-2);
    background: var(--surface); cursor: pointer; transition: background .15s, opacity .15s;
  }
  .btn:hover:not(:disabled) { background: var(--surface-2); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn.primary:hover:not(:disabled) { background: #6cc99a; }

  /* ---------- Chat ---------- */
  header.bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--surface-2);
  }
  .bar h2 { font-size: 1.05rem; }
  .bar .sub { color: var(--muted); font-size: 0.8rem; }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status[data-state="connected"] .dot { background: var(--accent); }
  .status[data-state="connecting"] .dot,
  .status[data-state="reconnecting"] .dot { background: #d9b45a; }
  .status[data-state="disconnected"] .dot { background: var(--danger); }

  #messages {
    flex: 1; overflow-y: auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 10px;
    overscroll-behavior: contain;
  }
  .empty { margin: auto; color: var(--muted); text-align: center; max-width: 30ch; }
  .msg { max-width: min(78%, 520px); display: flex; flex-direction: column; gap: 2px; }
  .msg .meta { font-size: 0.75rem; color: var(--muted); padding: 0 6px; }
  .msg .bubble {
    padding: 9px 13px; border-radius: var(--radius); background: var(--surface-2);
    overflow-wrap: anywhere; white-space: pre-wrap;
  }
  .msg.theirs { align-self: flex-start; }
  .msg.theirs .bubble { border-bottom-left-radius: 4px; }
  .msg.mine { align-self: flex-end; align-items: flex-end; }
  .msg.mine .bubble { background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
  .msg.pending .bubble { opacity: .6; }
  .msg.failed .bubble { outline: 1px solid var(--danger); }

  form.composer {
    display: flex; gap: 8px; padding: 10px 12px; background: var(--surface);
    border-top: 1px solid var(--surface-2);
  }
  .counter { color: var(--muted); font-size: 0.75rem; padding: 0 14px 6px; background: var(--surface); text-align: right; }
  .counter.over { color: var(--danger); }

  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .tab { padding: 10px 6px; border-radius: 10px; border: 1px solid var(--surface-2); background: var(--surface); cursor: pointer; font-size: .9rem; }
  .tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .link { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; text-align: left; font-size: .9rem; }
  .pending .link, .failed .link { display: none; }
  .flag { color: var(--danger); }
  #older-btn { margin: 8px auto 0; font-size: .85rem; padding: 8px 14px; }

  @media (min-width: 720px) {
    #chat { max-width: 760px; margin: 0 auto; border-inline: 1px solid var(--surface-2); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<!-- Screen 1: Welcome -->
<main id="welcome" class="screen">
  <div class="card">
    <h1>Anonymous Chat</h1>
    <p class="lead">One public room. Join as a guest or with an account. Recent messages are kept for everyone.</p>

    <form id="join-form" class="card" style="gap:12px" novalidate>
      <div class="tabs" role="group" aria-label="How to join">
        <button type="button" class="tab" data-mode="guest" aria-pressed="true">Guest</button>
        <button type="button" class="tab" data-mode="signin" aria-pressed="false">Sign in</button>
        <button type="button" class="tab" data-mode="signup" aria-pressed="false">Create account</button>
      </div>
      <div id="nick-field">
        <label for="nickname">Nickname</label>
        <div class="field">
          <input id="nickname" type="text" maxlength="24" autocomplete="off"
                 placeholder="2–24 characters" aria-describedby="nick-hint nick-error">
          <button type="button" id="random-btn" class="btn">Random</button>
        </div>
        <p id="nick-hint" class="hint">Pick a name or generate one. Nicknames are not unique.</p>
      </div>
      <div id="account-fields" hidden style="display:grid; gap:12px">
        <div><label for="email">Email</label><input id="email" type="email" autocomplete="email" style="width:100%"></div>
        <div><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" style="width:100%"></div>
        <button type="button" id="forgot-btn" class="link" hidden>Forgot password?</button>
      </div>
      <p id="nick-error" class="error" role="alert"></p>
      <button type="submit" id="join-btn" class="btn primary">Join as guest</button>
    </form>
  </div>
</main>

<!-- Screen 2: Chat -->
<section id="chat" class="screen" hidden>
  <header class="bar">
    <div>
      <h2>Anonymous Chat</h2>
      <div class="sub">Public conversation · <span id="me-name"></span></div>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <span id="status" class="status" data-state="connecting" aria-live="polite">
        <span class="dot"></span><span id="status-text">Connecting…</span>
      </span>
      <button type="button" id="leave-btn" class="btn">Leave</button>
    </div>
  </header>

  <button type="button" id="older-btn" class="btn" hidden>Load older messages</button>
  <button type="button" id="purge-btn" class="btn" hidden style="margin:6px auto 0; font-size:.8rem; padding:6px 12px">Admin: purge messages older than 30 days</button>
  <div id="messages" role="log" aria-live="polite" aria-label="Conversation">
    <p class="empty" id="empty-note">Nothing here yet. Messages sent after you joined will appear.</p>
  </div>

  <div id="counter" class="counter">0 / 500</div>
  <form id="composer" class="composer" novalidate>
    <label for="msg-input" style="position:absolute;left:-9999px">Message</label>
    <input id="msg-input" type="text" autocomplete="off" placeholder="Write a message">
    <button type="submit" id="send-btn" class="btn primary">Send</button>
  </form>
</section>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInAnonymously, signOut, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getDatabase, ref, onValue, push, set, query, orderByChild, limitToLast, limitToFirst, endBefore, get, update, remove, onChildAdded, onChildRemoved, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // ---------- Firebase config (public by design; security lives in the database rules) ----------
  const firebaseConfig = {
    apiKey: "AIzaSyDp_HlVfOgjzQdCWK4iAB_MHm4twZnCvag",
    authDomain: "anonymous-68a75.firebaseapp.com",
    databaseURL: "https://anonymous-68a75-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "anonymous-68a75",
    appId: "1:430304804728:web:7248c4162ec07e579f528d"
  };
  const configured = !Object.values(firebaseConfig).some((v) => v.startsWith("PASTE"));
  let db = null, auth = null;
  if (configured) {
    const app = initializeApp(firebaseConfig);
    db = getDatabase(app);
    auth = getAuth(app);
  }

  // ---------- Constants ----------
  const NICK_MIN = 2, NICK_MAX = 24, MSG_MAX = 500, SEND_COOLDOWN_MS = 1500 /* server rule enforces 1000ms; margin covers network jitter */;

  // ---------- Elements ----------
  const $ = (id) => document.getElementById(id);
  const welcome = $('welcome'), chat = $('chat');
  const nickInput = $('nickname'), nickError = $('nick-error');
  const messagesEl = $('messages'), msgInput = $('msg-input'), counter = $('counter');
  msgInput.maxLength = MSG_MAX;

  // ---------- State ----------
  let nickname = '', uid = null, joining = false, lastSend = 0, isAdmin = false, stopReports = null, reported = new Set();
  let stopConnWatch = null, stopMessages = null;
  const els = new Map();     // message key -> DOM element
  const pending = new Set(); // keys of messages we sent that the server hasn't confirmed

  // ---------- Screens ----------
  function showScreen(name) {
    welcome.hidden = name !== 'welcome';
    chat.hidden = name !== 'chat';
    if (name === 'chat') msgInput.focus();
  }

  // ---------- Nickname ----------
  const ADJ = ['Silent','Cosmic','Hidden','Curious','Shadow','Quiet','Lucky','Neon','Misty','Brave','Amber','Rusty'];
  const NOUN = ['Wolf','Fox','Raven','Ghost','Traveler','Owl','Comet','Lynx','Otter','Falcon','Moth','Badger'];
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const randomNickname = () => pick(ADJ) + pick(NOUN) + Math.floor(Math.random() * 100);

  function validateNickname(raw) {
    const n = raw.trim().replace(/\s+/g, ' ');
    if (n.length < NICK_MIN) return { error: `Nickname must be at least ${NICK_MIN} characters.` };
    if (n.length > NICK_MAX) return { error: `Nickname must be at most ${NICK_MAX} characters.` };
    return { value: n };
  }

  $('random-btn').addEventListener('click', () => {
    nickInput.value = randomNickname();
    nickError.textContent = '';
  });

  // ---------- Rendering ----------
  const formatTime = (ts) => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  // Always textContent, never innerHTML, for user-supplied strings.
  function buildMessage({ key, nick, text, ts, mine, state }) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + (mine ? 'mine' : 'theirs') + (state ? ' ' + state : '');
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = `${mine ? 'You' : nick} · ${formatTime(ts)}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.append(meta, bubble);
    if (key) {
      const addLink = (label, fn) => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'link'; b.textContent = label;
        b.addEventListener('click', fn);
        meta.append(' · ', b);
      };
      if (mine || isAdmin) addLink('Delete', () => deleteMessage(key));
      if (!mine && !isAdmin) addLink('Report', () => reportMessage(key, nick, text));
      if (isAdmin && reported.has(key)) meta.append(makeFlag());
    }
    return wrap;
  }

  function makeFlag() {
    const f = document.createElement('span');
    f.className = 'flag'; f.textContent = ' · ⚑ reported';
    return f;
  }
  function applyBadges() {
    for (const [key, el] of els) {
      const meta = el.querySelector('.meta'), flag = meta.querySelector('.flag');
      if (reported.has(key) && !flag) meta.append(makeFlag());
      else if (!reported.has(key) && flag) flag.remove();
    }
  }
  function watchReports() {
    stopReports = onValue(ref(db, 'reports'), (snap) => {
      reported = new Set(Object.keys(snap.val() || {}));
      applyBadges();
    }, () => {});
  }

  async function reportMessage(key, nick, text) {
    if (!confirm('Report this message to the admin?')) return;
    try {
      await set(ref(db, `reports/${key}/${uid}`), { nick, text, ts: serverTimestamp() });
      alert('Reported. Thank you.');
    } catch (err) {
      console.error(err);
      alert(err.code === 'PERMISSION_DENIED' ? 'You already reported this message.' : 'Report failed.');
    }
  }

  function dropElement(key) { els.get(key)?.remove(); els.delete(key); }

  async function deleteMessage(key) {
    if (!confirm('Delete this message for everyone?')) return;
    try {
      // Admins also clear the message's reports in the same write; normal users may only delete their own message.
      await (isAdmin ? update(ref(db), { [`messages/${key}`]: null, [`reports/${key}`]: null })
                     : remove(ref(db, `messages/${key}`)));
      dropElement(key);
    }
    catch (err) { console.error(err); alert('Delete failed.'); }
  }

  function renderMessage(m) {
    $('empty-note')?.remove();
    const wrap = buildMessage(m);
    const nearBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 80;
    messagesEl.appendChild(wrap);
    if (m.mine || nearBottom) messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrap;
  }

  function resetMessages() {
    messagesEl.replaceChildren();
    const note = document.createElement('p');
    note.className = 'empty'; note.id = 'empty-note';
    note.textContent = 'No messages yet. Say hello.';
    messagesEl.appendChild(note);
  }

  function setStatus(state, label) {
    $('status').dataset.state = state;
    $('status-text').textContent = label;
  }

  // ---------- Connection ----------
  function watchConnection() {
    setStatus('connecting', 'Connecting…');
    let wasConnected = false;
    stopConnWatch = onValue(ref(db, '.info/connected'), (snap) => {
      if (!navigator.onLine) return setStatus('disconnected', 'Offline');
      if (snap.val() === true) { wasConnected = true; setStatus('connected', 'Connected'); }
      else if (wasConnected) setStatus('reconnecting', 'Reconnecting…');
      else setStatus('connecting', 'Connecting…');
    }, () => setStatus('disconnected', 'Connection error'));
  }
  window.addEventListener('offline', () => { if (uid) setStatus('disconnected', 'Offline'); });
  window.addEventListener('online', () => { if (uid) setStatus('reconnecting', 'Reconnecting…'); });

  // ---------- History + live listener ----------
  const PAGE = 50;
  let oldest = null; // { ts, key } of the oldest message currently loaded

  function toView(snap) {
    const v = snap.val() || {};
    if (typeof v.text !== 'string' || typeof v.nick !== 'string') return null; // ignore malformed data
    return { nick: v.nick.slice(0, NICK_MAX), text: v.text.slice(0, MSG_MAX), ts: Number(v.ts) || Date.now(), mine: v.uid === uid };
  }
  const track = (key, ts) => { if (!oldest || ts < oldest.ts) oldest = { ts, key }; };

  // Last PAGE messages, then every new one. Older ones load on demand (bandwidth stays bounded).
  function listen() {
    const q = query(ref(db, 'messages'), orderByChild('ts'), limitToLast(PAGE));
    stopMessages = onChildAdded(q, (snap) => {
      const key = snap.key;
      if (els.has(key)) return;
      const m = toView(snap);
      if (!m) return;
      track(key, m.ts);
      els.set(key, renderMessage({ ...m, key, state: pending.has(key) ? 'pending' : '' }));
    }, () => setStatus('disconnected', 'Cannot read messages'));
    // child_removed also fires when the 50-message window slides, so confirm the message is really gone.
    const offRemoved = onChildRemoved(q, async (snap) => {
      const key = snap.key;
      if (pending.has(key) || !els.has(key)) return; // rollback of our own failed write
      try { if (!(await get(ref(db, 'messages/' + key))).exists()) dropElement(key); } catch { /* keep it */ }
    });
    const offAdded = stopMessages;
    stopMessages = () => { offAdded(); offRemoved(); };
    $('older-btn').hidden = false;
  }

  $('older-btn').addEventListener('click', async () => {
    if (!oldest) return;
    const btn = $('older-btn');
    btn.disabled = true;
    try {
      const snap = await get(query(ref(db, 'messages'), orderByChild('ts'), endBefore(oldest.ts, oldest.key), limitToLast(PAGE)));
      const items = [];
      snap.forEach((c) => { const m = els.has(c.key) ? null : toView(c); if (m) items.push([c.key, m]); });
      const prevH = messagesEl.scrollHeight;
      const first = messagesEl.querySelector('.msg');
      for (const [key, m] of items) {            // ascending order, each inserted before the first loaded message
        const el = buildMessage({ ...m, key });
        messagesEl.insertBefore(el, first);
        els.set(key, el);
        track(key, m.ts);
      }
      messagesEl.scrollTop += messagesEl.scrollHeight - prevH; // keep the reader's place
      if (snap.size < PAGE) btn.hidden = true;
    } catch (err) {
      console.error(err);
      btn.textContent = 'Could not load. Tap to retry';
    } finally {
      btn.disabled = false;
    }
  });

  // ---------- Join ----------
  const LABELS = { guest: 'Join as guest', signin: 'Sign in', signup: 'Create account' };
  let mode = 'guest';

  function setMode(m) {
    mode = m;
    document.querySelectorAll('[data-mode]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
    $('account-fields').hidden = m === 'guest';
    $('nick-field').hidden = m === 'signin';
    $('forgot-btn').hidden = m !== 'signin';
    $('password').autocomplete = m === 'signup' ? 'new-password' : 'current-password';
    $('join-btn').textContent = LABELS[m];
    nickError.textContent = '';
  }
  document.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));

  function setJoining(on) {
    joining = on;
    $('join-btn').disabled = on;
    $('join-btn').textContent = on ? 'Please wait…' : LABELS[mode];
  }

  function joinErrorMessage(err) {
    console.error(err);
    const map = {
      'auth/operation-not-allowed': 'This sign-in method is not enabled in Firebase Authentication.',
      'auth/unauthorized-domain': "This website's domain is not listed in Firebase Authorized domains.",
      'auth/network-request-failed': 'Network error. Check your connection and try again.',
      'auth/too-many-requests': 'Too many attempts. Try again later.',
      'auth/invalid-credential': 'Wrong email or password.',
      'auth/invalid-email': 'That email address is not valid.',
      'auth/email-already-in-use': 'That email already has an account. Use Sign in.',
      'auth/weak-password': 'Password must be at least 6 characters.',
      'auth/missing-password': 'Enter your password.'
    };
    return map[err.code] || 'Could not join. Try again.';
  }

  $('join-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (joining) return;
    if (!configured) { nickError.textContent = 'Firebase is not configured.'; return; }
    let nick = null;
    if (mode !== 'signin') {
      const r = validateNickname(nickInput.value);
      if (r.error) { nickError.textContent = r.error; nickInput.focus(); return; }
      nick = r.value;
    }
    const email = $('email').value.trim(), password = $('password').value;
    if (mode !== 'guest' && (!email || !password)) { nickError.textContent = 'Enter your email and password.'; return; }
    nickError.textContent = '';
    setJoining(true);
    try {
      let user;
      if (mode === 'guest') {
        user = (await signInAnonymously(auth)).user;
      } else if (mode === 'signup') {
        user = (await createUserWithEmailAndPassword(auth, email, password)).user;
        await updateProfile(user, { displayName: nick });   // the account's nickname lives in the Auth profile
      } else {
        user = (await signInWithEmailAndPassword(auth, email, password)).user;
        nick = (user.displayName || email.split('@')[0] || 'user').slice(0, NICK_MAX).padEnd(NICK_MIN, '_');
      }
      uid = user.uid;
      nickname = nick;
      $('me-name').textContent = nickname;
      isAdmin = await get(ref(db, 'admins/' + uid)).then((s) => s.val() === true, () => false);
      $('purge-btn').hidden = !isAdmin;
      if (isAdmin) watchReports();
      showScreen('chat');
      watchConnection();
      listen();
    } catch (err) {
      nickError.textContent = joinErrorMessage(err);
      if (auth.currentUser) signOut(auth).catch(() => {});
    } finally {
      setJoining(false);
    }
  });

  $('forgot-btn').addEventListener('click', async () => {
    const email = $('email').value.trim();
    if (!email) { nickError.textContent = 'Enter your email first.'; return; }
    try {
      await sendPasswordResetEmail(auth, email);
      nickError.textContent = 'If an account exists for that email, a reset link was sent.';
    } catch (err) { nickError.textContent = joinErrorMessage(err); }
  });

  // ---------- Send ----------
  msgInput.addEventListener('input', () => {
    counter.textContent = `${msgInput.value.length} / ${MSG_MAX}`;
  });

  function markFailed(key, text) {
    if (!uid) return; // already left
    const el = els.get(key) ?? renderMessage({ nick: nickname, text, ts: Date.now(), mine: true });
    els.set(key, el);
    el.classList.remove('pending');
    el.classList.add('failed');
    el.querySelector('.meta').textContent += ' · Failed to send';
  }

  $('composer').addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = msgInput.value.trim();
    if (!text || text.length > MSG_MAX || !uid) return;
    const now = Date.now();
    if (now - lastSend < SEND_COOLDOWN_MS) return; // basic accidental-repeat guard (client-side only)
    lastSend = now;
    $('send-btn').disabled = true;
    setTimeout(() => { $('send-btn').disabled = false; }, SEND_COOLDOWN_MS);

    const newRef = push(ref(db, 'messages'));
    const key = newRef.key;
    pending.add(key);
    msgInput.value = '';
    counter.textContent = `0 / ${MSG_MAX}`;
    msgInput.focus();
    try {
      await update(ref(db), {
        [`messages/${key}`]: { uid, nick: nickname, text, ts: serverTimestamp() },
        [`lastPost/${uid}`]: serverTimestamp() // rules require this in the same write
      });
      pending.delete(key);
      els.get(key)?.classList.remove('pending');
    } catch (err) {
      console.error(err);
      pending.delete(key);
      markFailed(key, text);
    }
  });

  // ---------- Admin purge (rules only allow admins to delete) ----------
  $('purge-btn').addEventListener('click', async () => {
    if (!isAdmin || !confirm('Delete up to 500 messages older than 30 days?')) return;
    const cutoff = Date.now() - 30 * 24 * 3600 * 1000;
    try {
      const snap = await get(query(ref(db, 'messages'), orderByChild('ts'), endBefore(cutoff), limitToFirst(500)));
      if (!snap.exists()) { alert('Nothing older than 30 days.'); return; }
      const updates = {};
      snap.forEach((c) => { updates['messages/' + c.key] = null; });
      await update(ref(db), updates);
      snap.forEach((c) => dropElement(c.key));
      alert(`Deleted ${snap.size} messages.`);
    } catch (err) { console.error(err); alert('Purge failed.'); }
  });

  // ---------- Leave ----------
  $('leave-btn').addEventListener('click', async () => {
    stopMessages?.(); stopMessages = null;
    stopConnWatch?.(); stopConnWatch = null;
    stopReports?.(); stopReports = null; reported = new Set();
    uid = null; oldest = null; isAdmin = false; $('purge-btn').hidden = true;
    els.clear(); pending.clear();
    $('older-btn').hidden = true; $('older-btn').textContent = 'Load older messages'; $('password').value = '';
    resetMessages();
    showScreen('welcome');
    if (auth) await signOut(auth).catch(() => {});
  });

  // ---------- Mobile keyboard handling ----------
  if (window.visualViewport) {
    const fit = () => {
      document.documentElement.style.setProperty('--app-h', window.visualViewport.height + 'px');
      if (!chat.hidden) messagesEl.scrollTop = messagesEl.scrollHeight;
    };
    window.visualViewport.addEventListener('resize', fit);
    fit();
  }
</script>
</body>
</html>
